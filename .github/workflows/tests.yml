name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    # Die Integritätsregeln leben in PostgreSQL (Exclusion Constraints, Trigger) –
    # die Tests laufen deshalb gegen eine echte Datenbank, nicht gegen SQLite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cico_test
          POSTGRES_USER: cico
          POSTGRES_PASSWORD: cico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cico -d cico_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: cico
      DB_PASSWORD: cico

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/phpunit
